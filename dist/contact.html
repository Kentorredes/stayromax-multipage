<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Stayro Max</title>  <link rel="stylesheet" crossorigin href="/assets/styles-DiQmLMel.css">
</head><body><header data-header></header><main><section class="page-hero"><p class="eyebrow">Project enquiry</p><h1>Bring us the <em>constraint.</em></h1><p class="lead">Tell us what the project needs. This form prepares an email in your email application; it is not a connected backend.</p></section><section class="content"><form class="enquiry" action="mailto:info@stayromax.com" method="post"><div class="field-row"><label>Full name<input name="name" autocomplete="name" required></label><label>Work email<input name="email" type="email" autocomplete="email" required></label></div><label>Project / system<select name="project"><option>EPS insulation</option><option>XPS boards</option><option>EPP components</option><option>EIFS systems</option><option>EPS geofoam</option><option>Architectural profiles</option><option>Protective packaging</option><option>Other</option></select></label><label>Tell us about the requirement<textarea name="message" required placeholder="Project location, approximate scope, material or performance requirement…"></textarea></label><button class="button" type="submit">Prepare project enquiry ↗</button><p class="form-status" aria-live="polite">Your email application will open to send the enquiry.</p></form></section></main><footer data-footer></footer><script src="app.js" defer></script></body></html>
